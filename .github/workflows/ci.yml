name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: games_test
          POSTGRES_USER: games_test
          POSTGRES_PASSWORD: integration-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U games_test -d games_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://games_test:integration-test-only@localhost:5432/games_test
      PUBLIC_ORIGIN: http://localhost:3000
      SETUP_TOKEN: ci-setup-token-only-for-disposable-test-database
      TEST_SETUP_TOKEN: ci-setup-token-only-for-disposable-test-database
      TEST_BASE_URL: http://localhost:3000
      TEST_DATABASE_DISPOSABLE: '1'
      STEAM_AUTH_ENABLED: 'true'
      TRUST_PROXY: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      HOSTNAME: 127.0.0.1
      PORT: '3000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        id: install
      - run: npm run lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: npm audit --omit=dev --audit-level=high
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: npm test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: npm run typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: npm run build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: npm run test:upgrade
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - name: Integration checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          npm start > /tmp/games-app.log 2>&1 &
          trap 'cat /tmp/games-app.log' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/api/health; then break; fi
            sleep 1
          done
          npm run test:integration
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --progress=plain -t gamequeue:ci .
      - name: Standalone-CLI im Image prüfen
        run: |
          docker run --rm --entrypoint node gamequeue:ci --import ./scripts/register-paths.mjs --input-type=module -e "const {migrationFiles}=await import('./src/lib/db/migrate.ts'); if((await migrationFiles()).length!==3)throw new Error('Migrationen fehlen'); await import('./src/lib/steam.ts'); const {db}=await import('./src/lib/db.ts'); await db.end(); console.log('Standalone-Module und Migrationen vorhanden.');"

